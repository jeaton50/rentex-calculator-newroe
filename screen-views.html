<!DOCTYPE html>
<!-- Version: 2025-11-21-v3 - Side lines removed -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Screen Views - LED Wall Calculator</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      margin: 20px;
      background: var(--bg-gradient);
      padding: 20px;
    }

    .container {
      max-width: 95%;
      margin: 0 auto;
      background: var(--card-gradient);
      padding: 30px;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    h1 {
      text-align: center;
      color: var(--text-dark);
      margin-bottom: 10px;
    }

    .screen-info {
      text-align: center;
      margin-bottom: 30px;
      padding: 15px;
      background: rgba(220, 38, 38, 0.05);
      border-radius: 8px;
      border: 1px solid rgba(220, 38, 38, 0.1);
    }

    .screen-info h2 {
      margin: 5px 0;
      color: var(--text-dark);
      font-size: 18px;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
      padding: 20px;
      background: rgba(220, 38, 38, 0.05);
      border-radius: 8px;
      border: 1px solid rgba(220, 38, 38, 0.1);
    }

    .controls label {
      font-weight: bold;
      font-size: 16px;
    }

    .controls input[type="range"] {
      width: 300px;
      cursor: pointer;
    }

    .controls .curve-value {
      font-size: 20px;
      font-weight: bold;
      color: var(--primary-color);
      min-width: 80px;
      text-align: center;
    }

    .curve-type {
      font-size: 14px;
      color: #666;
      font-style: italic;
    }

    .views-container {
      display: flex;
      gap: 30px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .view-section {
      flex: 1;
      min-width: 600px;
      max-width: 1200px;
    }

    .view-section h3 {
      text-align: center;
      color: #333;
      margin-bottom: 15px;
      font-size: 20px;
    }

    .canvas-wrapper {
      border: 2px solid #ddd;
      border-radius: 5px;
      background: #fff;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      max-width: 100%;
    }

    .back-button {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 20px;
      background: var(--primary-color);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: var(--transition-base);
      box-shadow: var(--shadow-sm);
    }

    .back-button:hover {
      background: #b91c1c;
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .reset-button {
      display: inline-block;
      padding: 8px 16px;
      background: #6c757d;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      margin-left: 15px;
    }

    .reset-button:hover {
      background: #5a6268;
    }

    .zoom-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
    }

    .zoom-button {
      padding: 8px 16px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .zoom-button:hover {
      background: #218838;
    }

    .zoom-level {
      padding: 8px 16px;
      background: #f0f0f0;
      border-radius: 5px;
      font-weight: bold;
      display: flex;
      align-items: center;
    }

    .capture-button {
      display: inline-block;
      padding: 8px 16px;
      background: #17a2b8;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }

    .capture-button:hover {
      background: #138496;
    }

    .info-text {
      text-align: center;
      color: #666;
      margin-top: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-button" id="backButton">← Back to Calculator</a>

    <h1>Screen Views</h1>

    <div class="screen-info">
      <h2 id="productInfo">Product: Loading...</h2>
      <h2 id="dimensionsInfo">Screen Size: Loading...</h2>
    </div>

    <div class="controls">
      <div id="singleCurveControl" style="display: flex; align-items: center; gap: 20px;">
        <label for="curveSlider">Curve Adjustment:</label>
        <input type="range" id="curveSlider" min="-5" max="5" step="2.5" value="0">
        <div>
          <div class="curve-value" id="curveValue">0°</div>
          <div class="curve-type" id="curveType">Flat</div>
        </div>
      </div>

      <!-- Dual curve controls for GP2 products -->
      <div id="dualCurveControls" style="display: none; width: 100%;">
        <div style="display: flex; flex-direction: column; gap: 15px; width: 100%;">
          <!-- Horizontal curve control -->
          <div style="display: flex; align-items: center; gap: 20px;">
            <label for="horizontalCurveSlider" style="min-width: 150px;">Horizontal Curve:</label>
            <input type="range" id="horizontalCurveSlider" min="-5" max="5" step="1" value="0" style="width: 300px;">
            <div>
              <div class="curve-value" id="horizontalCurveValue">0°</div>
              <div class="curve-type" id="horizontalCurveType">Flat</div>
            </div>
          </div>

          <!-- Vertical curve control -->
          <div style="display: flex; align-items: center; gap: 20px;">
            <label for="verticalCurveSlider" style="min-width: 150px;">Vertical Curve:</label>
            <input type="range" id="verticalCurveSlider" min="-3" max="3" step="1" value="0" style="width: 300px;">
            <div>
              <div class="curve-value" id="verticalCurveValue">0°</div>
              <div class="curve-type" id="verticalCurveType">Flat</div>
            </div>
          </div>
        </div>
      </div>

      <button type="button" class="reset-button" id="resetButton">Reset View</button>
    </div>

    <div class="views-container">
      <div class="view-section">
        <h3>Front View</h3>
        <div class="canvas-wrapper">
          <canvas id="frontViewCanvas" width="1000" height="600"></canvas>
        </div>
        <div style="text-align: center;">
          <button type="button" class="capture-button" id="captureFrontButton">📸 Capture Front View</button>
        </div>
      </div>

      <div class="view-section">
        <h3>Top View</h3>
        <div class="canvas-wrapper">
          <canvas id="topViewCanvas" width="1000" height="600"></canvas>
        </div>
        <div class="zoom-controls">
          <button type="button" class="zoom-button" id="zoomOutButton">Zoom Out</button>
          <div class="zoom-level" id="zoomLevel">50%</div>
          <button type="button" class="zoom-button" id="zoomInButton">Zoom In</button>
        </div>
        <div style="text-align: center;">
          <button type="button" class="capture-button" id="captureTopButton">📸 Capture Top View</button>
        </div>
      </div>
    </div>

    <div class="info-text">
      <p id="rangeInfo"><strong>Convex:</strong> Negative angles | <strong>Flat:</strong> 0° | <strong>Concave:</strong> Positive angles</p>
    </div>
  </div>

  <script>
    // Get screen parameters from URL or localStorage
    function getScreenParameters() {
      const urlParams = new URLSearchParams(window.location.search);

      const productType = (urlParams.get('product') || localStorage.getItem('screenProduct') || 'absen').toLowerCase();

      // Get GP2 Half configuration parameters
      const gp2HalfAutoRows = parseInt(urlParams.get('gp2HalfAutoRows') || localStorage.getItem('gp2HalfAutoRows') || '0');
      const gp2HalfManualRows = parseInt(urlParams.get('gp2HalfManualRows') || localStorage.getItem('gp2HalfManualRows') || '0');
      const gp2HalfManualPosition = urlParams.get('gp2HalfManualPosition') || localStorage.getItem('gp2HalfManualPosition') || 'bottom';
      const gp2FullVerticalBlocks = parseInt(urlParams.get('gp2FullVerticalBlocks') || localStorage.getItem('gp2FullVerticalBlocks') || urlParams.get('blocksVer') || localStorage.getItem('screenBlocksVer') || '6');

      // Set block dimensions based on product type
      let blockWidth = 500;   // mm - default for most products
      let blockHeight = 500;  // mm - default for most products

      // Check if we have mixed GP2 configuration
      const hasMixedGP2 = productType === 'roegp26full' && (gp2HalfAutoRows > 0 || gp2HalfManualRows > 0);

      if (productType === 'roegp26full' && !hasMixedGP2) {
        blockWidth = 500;   // mm
        blockHeight = 1000; // mm - GP2 Full is 500x1000
      }

      // For mixed GP2, we'll handle heights per-row
      const halfBlockHeight = 500;   // mm - GP2 Half
      const fullBlockHeight = 1000;  // mm - GP2 Full

      // Calculate total vertical blocks for mixed configurations
      let blocksVer = parseInt(urlParams.get('blocksVer') || localStorage.getItem('screenBlocksVer') || '6');
      if (hasMixedGP2) {
        // Calculate layout
        let topHalfRows = 0;
        let bottomHalfRows = 0;

        if (gp2HalfAutoRows > 0 && gp2HalfManualRows > 0) {
          topHalfRows = gp2HalfAutoRows;
          if (gp2HalfManualPosition === 'top') {
            topHalfRows += gp2HalfManualRows;
          } else {
            bottomHalfRows = gp2HalfManualRows;
          }
        } else if (gp2HalfAutoRows > 0) {
          topHalfRows = gp2HalfAutoRows;
        } else if (gp2HalfManualRows > 0) {
          if (gp2HalfManualPosition === 'top') {
            topHalfRows = gp2HalfManualRows;
          } else {
            bottomHalfRows = gp2HalfManualRows;
          }
        }

        blocksVer = topHalfRows + gp2FullVerticalBlocks + bottomHalfRows;
      }

      return {
        productType: productType,
        blocksHor: parseInt(urlParams.get('blocksHor') || localStorage.getItem('screenBlocksHor') || '10'),
        blocksVer: blocksVer,
        powerDistroType: urlParams.get('powerDistroType') || localStorage.getItem('screenPowerDistroType') || '208',
        blockWidth: blockWidth,
        blockHeight: blockHeight,
        gp2HalfAutoRows: gp2HalfAutoRows,
        gp2HalfManualRows: gp2HalfManualRows,
        gp2HalfManualPosition: gp2HalfManualPosition,
        gp2FullVerticalBlocks: gp2FullVerticalBlocks,
        hasMixedGP2: hasMixedGP2,
        halfBlockHeight: halfBlockHeight,
        fullBlockHeight: fullBlockHeight
      };
    }

    const params = getScreenParameters();

    // Product-specific configuration
    const productConfig = {
      absen: {
        displayName: 'Absen PL2.5',
        minCurve: -7.5,
        maxCurve: 10,
        step: 2.5,
        rangeText: '(-7.5° to 0°) | <strong>Flat:</strong> 0° | <strong>Concave:</strong> Positive angles (0° to +10°)'
      },
      theatrixx: {
        displayName: 'Theatrixx Nomad 2.6',
        minCurve: -5,
        maxCurve: 5,
        step: 2.5,
        rangeText: '(-5° to 0°) | <strong>Flat:</strong> 0° | <strong>Concave:</strong> Positive angles (0° to +5°)'
      },
      bp2b1: {
        displayName: 'ROE Black Pearl BP2B1',
        minCurve: 0,
        maxCurve: 5,
        step: 5,
        rangeText: '| <strong>Flat:</strong> 0° | <strong>Concave:</strong> +5°'
      },
      bp2b2: {
        displayName: 'ROE Black Pearl BP2B2',
        minCurve: 0,
        maxCurve: 5,
        step: 5,
        rangeText: '| <strong>Flat:</strong> 0° | <strong>Concave:</strong> +5°'
      },
      bp2v2: {
        displayName: 'ROE Black Pearl BP2V2',
        minCurve: 0,
        maxCurve: 5,
        step: 5,
        rangeText: '| <strong>Flat:</strong> 0° | <strong>Concave:</strong> +5°'
      },
      roegp26full: {
        displayName: 'ROE GP2.6 Full',
        minCurve: -5,
        maxCurve: 5,
        step: 5,
        rangeText: '<strong>Convex:</strong> -5° | <strong>Flat:</strong> 0° | <strong>Concave:</strong> +5°'
      },
      roegp26half: {
        displayName: 'ROE GP2.6 Half',
        minCurve: -5,
        maxCurve: 5,
        step: 5,
        rangeText: '<strong>Convex:</strong> -5° | <strong>Flat:</strong> 0° | <strong>Concave:</strong> +5°'
      }
    };

    const config = productConfig[params.productType] || productConfig.absen;

    // Update info display
    document.getElementById('productInfo').textContent = `Product: ${config.displayName}`;

    // Calculate height for mixed GP2 configurations
    let heightInMeters;
    if (params.hasMixedGP2) {
      // Calculate layout
      let topHalfRows = 0;
      let bottomHalfRows = 0;

      if (params.gp2HalfAutoRows > 0 && params.gp2HalfManualRows > 0) {
        topHalfRows = params.gp2HalfAutoRows;
        if (params.gp2HalfManualPosition === 'top') {
          topHalfRows += params.gp2HalfManualRows;
        } else {
          bottomHalfRows = params.gp2HalfManualRows;
        }
      } else if (params.gp2HalfAutoRows > 0) {
        topHalfRows = params.gp2HalfAutoRows;
      } else if (params.gp2HalfManualRows > 0) {
        if (params.gp2HalfManualPosition === 'top') {
          topHalfRows = params.gp2HalfManualRows;
        } else {
          bottomHalfRows = params.gp2HalfManualRows;
        }
      }

      const halfHeight = (topHalfRows + bottomHalfRows) * params.halfBlockHeight;
      const fullHeight = params.gp2FullVerticalBlocks * params.fullBlockHeight;
      heightInMeters = (halfHeight + fullHeight) / 1000;
    } else {
      heightInMeters = (params.blocksVer * params.blockHeight) / 1000;
    }

    document.getElementById('dimensionsInfo').textContent =
      `Screen Size: ${params.blocksHor} × ${params.blocksVer} tiles (${(params.blocksHor * params.blockWidth / 1000).toFixed(2)}m × ${heightInMeters.toFixed(2)}m)`;

    // Update range info text
    if (isGP2Product) {
      document.getElementById('rangeInfo').innerHTML = `
        <strong>Horizontal Curve:</strong> -5° to +5° |
        <strong>Vertical Curve:</strong> -3° to +3° |
        <strong>Convex:</strong> Negative angles | <strong>Flat:</strong> 0° | <strong>Concave:</strong> Positive angles
      `;
    } else {
      const convexText = config.minCurve < 0 ? '<strong>Convex:</strong> Negative angles ' : '';
      document.getElementById('rangeInfo').innerHTML = `${convexText}${config.rangeText}`;
    }

    // Update back button to preserve calculator state including GP2 Half parameters
    const backButton = document.getElementById('backButton');

    // Convert lowercase product type back to proper case for main page
    const productTypeMap = {
      'absen': 'absen',
      'bp2b1': 'BP2B1',
      'bp2b2': 'BP2B2',
      'bp2v2': 'BP2V2',
      'theatrixx': 'theatrixx',
      'roegp26full': 'ROEGP26Full',
      'roegp26half': 'ROEGP26Half'
    };
    const properCaseProduct = productTypeMap[params.productType] || params.productType;

    let backUrl = `index.html?product=${encodeURIComponent(properCaseProduct)}&blocksHor=${params.blocksHor}&blocksVer=${params.blocksVer}&powerDistroType=${params.powerDistroType}`;

    // Add GP2 Half parameters if they exist
    if (params.gp2HalfAutoRows > 0 || params.gp2HalfManualRows > 0) {
      backUrl += `&gp2HalfAutoRows=${params.gp2HalfAutoRows}&gp2HalfManualRows=${params.gp2HalfManualRows}&gp2HalfManualPosition=${encodeURIComponent(params.gp2HalfManualPosition)}&gp2FullVerticalBlocks=${params.gp2FullVerticalBlocks}`;
    }

    backButton.href = backUrl;

    // Check if GP2 product for dual curve controls
    const isGP2Product = params.productType === 'roegp26full' || params.productType === 'roegp26half';

    // Curve control variables
    let horizontalCurve = 0;
    let verticalCurve = 0;

    // Show/hide appropriate controls
    if (isGP2Product) {
      document.getElementById('singleCurveControl').style.display = 'none';
      document.getElementById('dualCurveControls').style.display = 'block';
    } else {
      document.getElementById('singleCurveControl').style.display = 'flex';
      document.getElementById('dualCurveControls').style.display = 'none';
    }

    // Single curve control (for non-GP2 products)
    const curveSlider = document.getElementById('curveSlider');
    const curveValue = document.getElementById('curveValue');
    const curveType = document.getElementById('curveType');

    // Dual curve controls (for GP2 products)
    const horizontalCurveSlider = document.getElementById('horizontalCurveSlider');
    const horizontalCurveValue = document.getElementById('horizontalCurveValue');
    const horizontalCurveType = document.getElementById('horizontalCurveType');
    const verticalCurveSlider = document.getElementById('verticalCurveSlider');
    const verticalCurveValue = document.getElementById('verticalCurveValue');
    const verticalCurveType = document.getElementById('verticalCurveType');

    // Set slider range based on product type
    curveSlider.min = config.minCurve;
    curveSlider.max = config.maxCurve;
    curveSlider.step = config.step;
    curveSlider.value = 0;

    // Zoom control for top view
    let topViewZoomLevel = 0.5;
    const zoomStep = 0.25;
    const minZoom = 0.5;
    const maxZoom = 3.0;

    function updateCurveDisplay(angle) {
      curveValue.textContent = `${angle > 0 ? '+' : ''}${angle}°`;

      if (angle < 0) {
        curveType.textContent = 'Convex';
        curveType.style.color = '#dc2626';
      } else if (angle > 0) {
        curveType.textContent = 'Concave';
        curveType.style.color = '#dc2626';
      } else {
        curveType.textContent = 'Flat';
        curveType.style.color = '#666';
      }
    }

    function updateCurveDisplayDual(angle, valueElement, typeElement) {
      valueElement.textContent = `${angle > 0 ? '+' : ''}${angle}°`;

      if (angle < 0) {
        typeElement.textContent = 'Convex';
        typeElement.style.color = '#dc2626';
      } else if (angle > 0) {
        typeElement.textContent = 'Concave';
        typeElement.style.color = '#dc2626';
      } else {
        typeElement.textContent = 'Flat';
        typeElement.style.color = '#666';
      }
    }

    // Draw front view
    function drawFrontView(verticalCurveAngle = 0) {
      const canvas = document.getElementById('frontViewCanvas');
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Calculate dimensions
      const padding = 50;
      const availableWidth = canvas.width - (padding * 2);
      const availableHeight = canvas.height - (padding * 2);

      // Calculate aspect ratio - for mixed GP2, need to account for different tile heights
      let actualWidth = params.blocksHor * params.blockWidth;
      let actualHeight;

      if (params.hasMixedGP2) {
        // Calculate layout
        let topHalfRows = 0;
        let bottomHalfRows = 0;

        if (params.gp2HalfAutoRows > 0 && params.gp2HalfManualRows > 0) {
          topHalfRows = params.gp2HalfAutoRows;
          if (params.gp2HalfManualPosition === 'top') {
            topHalfRows += params.gp2HalfManualRows;
          } else {
            bottomHalfRows = params.gp2HalfManualRows;
          }
        } else if (params.gp2HalfAutoRows > 0) {
          topHalfRows = params.gp2HalfAutoRows;
        } else if (params.gp2HalfManualRows > 0) {
          if (params.gp2HalfManualPosition === 'top') {
            topHalfRows = params.gp2HalfManualRows;
          } else {
            bottomHalfRows = params.gp2HalfManualRows;
          }
        }

        const halfHeight = (topHalfRows + bottomHalfRows) * params.halfBlockHeight;
        const fullHeight = params.gp2FullVerticalBlocks * params.fullBlockHeight;
        actualHeight = halfHeight + fullHeight;
      } else {
        actualHeight = params.blocksVer * params.blockHeight;
      }

      const aspectRatio = actualWidth / actualHeight;
      let screenWidth, screenHeight;

      if (availableWidth / availableHeight > aspectRatio) {
        screenHeight = availableHeight;
        screenWidth = screenHeight * aspectRatio;
      } else {
        screenWidth = availableWidth;
        screenHeight = screenWidth / aspectRatio;
      }

      const startX = (canvas.width - screenWidth) / 2;
      const startY = (canvas.height - screenHeight) / 2;
      const centerX = startX + screenWidth / 2;
      const centerY = startY + screenHeight / 2;

      if (verticalCurveAngle === 0) {
        // Draw flat screen (original behavior)
        // Draw screen background
        ctx.fillStyle = '#333';
        ctx.fillRect(startX, startY, screenWidth, screenHeight);

        // Draw tile grid
        const tileWidth = screenWidth / params.blocksHor;

        ctx.strokeStyle = '#555';
        ctx.lineWidth = 1;

        // Vertical lines
        for (let i = 0; i <= params.blocksHor; i++) {
          const x = startX + (i * tileWidth);
          ctx.beginPath();
          ctx.moveTo(x, startY);
          ctx.lineTo(x, startY + screenHeight);
          ctx.stroke();
        }

        // Horizontal lines - account for different row heights in mixed GP2
        if (params.hasMixedGP2) {
          // Calculate layout
          let topHalfRows = 0;
          let bottomHalfRows = 0;

          if (params.gp2HalfAutoRows > 0 && params.gp2HalfManualRows > 0) {
            topHalfRows = params.gp2HalfAutoRows;
            if (params.gp2HalfManualPosition === 'top') {
              topHalfRows += params.gp2HalfManualRows;
            } else {
              bottomHalfRows = params.gp2HalfManualRows;
            }
          } else if (params.gp2HalfAutoRows > 0) {
            topHalfRows = params.gp2HalfAutoRows;
          } else if (params.gp2HalfManualRows > 0) {
            if (params.gp2HalfManualPosition === 'top') {
              topHalfRows = params.gp2HalfManualRows;
            } else {
              bottomHalfRows = params.gp2HalfManualRows;
            }
          }

          const fullRowsStart = topHalfRows;
          const fullRowsEnd = topHalfRows + params.gp2FullVerticalBlocks;

          // Function to get tile type for row
          const getTileHeightForRow = (row) => {
            if (row < fullRowsStart) {
              return params.halfBlockHeight;
            } else if (row >= fullRowsEnd) {
              return params.halfBlockHeight;
            } else {
              return params.fullBlockHeight;
            }
          };

          // Calculate scale factor
          const scaleFactor = screenHeight / actualHeight;

          // Draw horizontal lines at accumulated heights
          let accumulatedY = startY;
          ctx.beginPath();
          ctx.moveTo(startX, accumulatedY);
          ctx.lineTo(startX + screenWidth, accumulatedY);
          ctx.stroke();

          for (let row = 0; row < params.blocksVer; row++) {
            const rowHeight = getTileHeightForRow(row);
            accumulatedY += rowHeight * scaleFactor;
            ctx.beginPath();
            ctx.moveTo(startX, accumulatedY);
            ctx.lineTo(startX + screenWidth, accumulatedY);
            ctx.stroke();
          }
        } else {
          // Uniform tile heights
          const tileHeight = screenHeight / params.blocksVer;
          for (let i = 0; i <= params.blocksVer; i++) {
            const y = startY + (i * tileHeight);
            ctx.beginPath();
            ctx.moveTo(startX, y);
            ctx.lineTo(startX + screenWidth, y);
            ctx.stroke();
          }
        }

        // Draw border
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.strokeRect(startX, startY, screenWidth, screenHeight);
      } else {
        // Draw vertically curved screen
        const angleRad = Math.abs((verticalCurveAngle * Math.PI) / 180);
        const totalAngle = angleRad * params.blocksVer;

        // Calculate radius for vertical curve
        const arcLength = screenHeight;
        const radius = totalAngle > 0 ? arcLength / totalAngle : 1000;
        const depth = screenWidth; // Depth representation

        // Determine curve direction
        const isConcave = verticalCurveAngle > 0;

        // For concave: arc center to the right, for convex: arc center to the left
        let arcCenterX;
        let baseAngle;

        if (isConcave) {
          // Concave: curves toward viewer (arc center to the right)
          arcCenterX = centerX + radius;
          baseAngle = Math.PI; // Start from left pointing right
        } else {
          // Convex: curves away from viewer (arc center to the left)
          arcCenterX = centerX - radius;
          baseAngle = 0; // Start from right pointing left
        }

        // Draw each vertical tile segment
        for (let i = 0; i < params.blocksVer; i++) {
          const startAngle = (-totalAngle / 2) + (i * angleRad);
          const endAngle = startAngle + angleRad;

          // Draw tile segment with depth
          ctx.beginPath();
          ctx.arc(arcCenterX, centerY, radius + depth / 2, baseAngle + startAngle, baseAngle + endAngle);
          ctx.arc(arcCenterX, centerY, radius - depth / 2, baseAngle + endAngle, baseAngle + startAngle, true);
          ctx.closePath();
          ctx.fillStyle = '#333';
          ctx.fill();
          ctx.strokeStyle = '#555';
          ctx.lineWidth = 1;
          ctx.stroke();

          // Draw outer arc border
          ctx.beginPath();
          ctx.arc(arcCenterX, centerY, radius + depth / 2, baseAngle + startAngle, baseAngle + endAngle);
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 2;
          ctx.stroke();

          // Draw inner arc border
          ctx.beginPath();
          ctx.arc(arcCenterX, centerY, radius - depth / 2, baseAngle + startAngle, baseAngle + endAngle);
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        // Draw horizontal grid lines across the curved surface
        const tileWidth = depth / params.blocksHor;
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 1;

        for (let i = 0; i <= params.blocksHor; i++) {
          const innerRadius = (radius - depth / 2) + (i * tileWidth);
          ctx.beginPath();
          ctx.arc(arcCenterX, centerY, innerRadius, baseAngle - totalAngle / 2, baseAngle + totalAngle / 2);
          ctx.stroke();
        }
      }

      // Add dimensions text
      ctx.fillStyle = '#000';
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(`${params.blocksHor} tiles`, centerX, startY - 15);

      ctx.save();
      ctx.translate(startX - 15, centerY);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText(`${params.blocksVer} tiles`, 0, 0);
      ctx.restore();
    }

    // Draw top view with curve
    function drawTopView(curveAngle) {
      const canvas = document.getElementById('topViewCanvas');
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Apply zoom transformation
      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.scale(topViewZoomLevel, topViewZoomLevel);
      ctx.translate(-canvas.width / 2, -canvas.height / 2);

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      // Scale factor for visualization
      const scale = 30; // pixels per tile
      const screenWidth = params.blocksHor * scale;
      const depth = 40; // Depth representation in pixels

      if (curveAngle === 0) {
        // Draw flat screen
        const startX = centerX - screenWidth / 2;

        // Draw screen
        ctx.fillStyle = '#333';
        ctx.fillRect(startX, centerY - depth / 2, screenWidth, depth);

        // Draw tile divisions
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 1;
        for (let i = 0; i <= params.blocksHor; i++) {
          const x = startX + (i * scale);
          ctx.beginPath();
          ctx.moveTo(x, centerY - depth / 2);
          ctx.lineTo(x, centerY + depth / 2);
          ctx.stroke();
        }

        // Draw border
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.strokeRect(startX, centerY - depth / 2, screenWidth, depth);

      } else {
        // Draw curved screen
        const angleRad = Math.abs((curveAngle * Math.PI) / 180);
        const totalAngle = angleRad * params.blocksHor;

        // Calculate radius
        // Arc length = radius * angle, so radius = arc length / angle
        const arcLength = screenWidth;
        const radius = totalAngle > 0 ? arcLength / totalAngle : 1000;

        // Determine curve direction
        const isConcave = curveAngle > 0;

        // For concave: arc center below, for convex: arc center above
        // Adjust positioning to keep arc visible
        let arcCenterY;
        let baseAngle;

        if (isConcave) {
          // Concave: curves toward viewer (arc center below screen)
          arcCenterY = centerY + radius;
          baseAngle = -Math.PI / 2; // Start from top pointing down
        } else {
          // Convex: curves away from viewer (arc center above screen)
          arcCenterY = centerY - radius;
          baseAngle = Math.PI / 2; // Start from bottom pointing up
        }

        // Draw each tile segment
        for (let i = 0; i < params.blocksHor; i++) {
          const startAngle = (-totalAngle / 2) + (i * angleRad);
          const endAngle = startAngle + angleRad;

          // Draw outer arc
          ctx.beginPath();
          ctx.arc(centerX, arcCenterY, radius + depth / 2, baseAngle + startAngle, baseAngle + endAngle);
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 2;
          ctx.stroke();

          // Draw inner arc
          ctx.beginPath();
          ctx.arc(centerX, arcCenterY, radius - depth / 2, baseAngle + startAngle, baseAngle + endAngle);
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 2;
          ctx.stroke();

          // Draw tile segment
          ctx.beginPath();
          ctx.arc(centerX, arcCenterY, radius + depth / 2, baseAngle + startAngle, baseAngle + endAngle);
          ctx.arc(centerX, arcCenterY, radius - depth / 2, baseAngle + endAngle, baseAngle + startAngle, true);
          ctx.closePath();
          ctx.fillStyle = '#333';
          ctx.fill();
          ctx.strokeStyle = '#555';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }

      // Add labels
      ctx.fillStyle = '#000';
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Audience View', centerX, 30);

      // Restore context after zoom transformation
      ctx.restore();
    }

    // Update displays
    function updateViews() {
      if (isGP2Product) {
        horizontalCurve = parseFloat(horizontalCurveSlider.value);
        verticalCurve = parseFloat(verticalCurveSlider.value);
        updateCurveDisplayDual(horizontalCurve, horizontalCurveValue, horizontalCurveType);
        updateCurveDisplayDual(verticalCurve, verticalCurveValue, verticalCurveType);
        drawFrontView(verticalCurve);
        drawTopView(horizontalCurve);
      } else {
        const angle = parseFloat(curveSlider.value);
        updateCurveDisplay(angle);
        drawFrontView();
        drawTopView(angle);
      }
    }

    // Reset function
    function resetView() {
      if (isGP2Product) {
        horizontalCurveSlider.value = 0;
        verticalCurveSlider.value = 0;
      } else {
        curveSlider.value = 0;
      }
      topViewZoomLevel = 0.5;
      updateZoomDisplay();
      updateViews();
    }

    // Zoom functions
    function zoomIn() {
      if (topViewZoomLevel < maxZoom) {
        topViewZoomLevel += zoomStep;
        updateZoomDisplay();
        if (isGP2Product) {
          drawTopView(parseFloat(horizontalCurveSlider.value));
        } else {
          drawTopView(parseFloat(curveSlider.value));
        }
      }
    }

    function zoomOut() {
      if (topViewZoomLevel > minZoom) {
        topViewZoomLevel -= zoomStep;
        updateZoomDisplay();
        if (isGP2Product) {
          drawTopView(parseFloat(horizontalCurveSlider.value));
        } else {
          drawTopView(parseFloat(curveSlider.value));
        }
      }
    }

    function updateZoomDisplay() {
      const zoomPercentage = Math.round(topViewZoomLevel * 100);
      document.getElementById('zoomLevel').textContent = `${zoomPercentage}%`;
    }

    // Capture functions
    function captureCanvas(canvasId, filename, includeInfo = true) {
      const originalCanvas = document.getElementById(canvasId);

      // Create a temporary canvas with extra height for info text
      const tempCanvas = document.createElement('canvas');
      const infoHeight = includeInfo ? 60 : 0;
      tempCanvas.width = originalCanvas.width;
      tempCanvas.height = originalCanvas.height + infoHeight;
      const ctx = tempCanvas.getContext('2d');

      // Fill with white background
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

      // Copy original canvas content
      ctx.drawImage(originalCanvas, 0, 0);

      // Add info text at the bottom if requested
      if (includeInfo) {
        const curveAngle = parseFloat(curveSlider.value);
        let curveText = '';

        if (canvasId === 'topViewCanvas') {
          if (curveAngle === 0) {
            curveText = 'Flat (0°)';
          } else if (curveAngle > 0) {
            curveText = `Concave (+${curveAngle}°)`;
          } else {
            curveText = `Convex (${curveAngle}°)`;
          }
        } else {
          curveText = 'Front View';
        }

        // Draw info section background
        ctx.fillStyle = '#f0f0f0';
        ctx.fillRect(0, originalCanvas.height, tempCanvas.width, infoHeight);

        // Draw text
        ctx.fillStyle = '#000000';
        ctx.font = 'bold 18px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(curveText, tempCanvas.width / 2, originalCanvas.height + 25);

        // Add product and dimensions info
        ctx.font = '14px Arial';
        ctx.fillText(`${config.displayName} - ${params.blocksHor} × ${params.blocksVer} tiles`, tempCanvas.width / 2, originalCanvas.height + 45);
      }

      // Convert to data URL and download
      const dataURL = tempCanvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = filename;
      link.href = dataURL;
      link.click();
    }

    function captureFrontView() {
      const productName = config.displayName.replace(/\s+/g, '_');
      const dimensions = `${params.blocksHor}x${params.blocksVer}`;
      const filename = `${productName}_Front_View_${dimensions}.png`;
      captureCanvas('frontViewCanvas', filename);
    }

    function captureTopView() {
      const productName = config.displayName.replace(/\s+/g, '_');
      const dimensions = `${params.blocksHor}x${params.blocksVer}`;

      let curveText;
      if (isGP2Product) {
        const hCurve = parseFloat(horizontalCurveSlider.value);
        const vCurve = parseFloat(verticalCurveSlider.value);
        if (hCurve === 0 && vCurve === 0) {
          curveText = 'Flat';
        } else {
          const hText = hCurve === 0 ? '0' : `${hCurve > 0 ? 'Concave' : 'Convex'}${Math.abs(hCurve)}`;
          const vText = vCurve === 0 ? '0' : `${vCurve > 0 ? 'Concave' : 'Convex'}${Math.abs(vCurve)}`;
          curveText = `H${hText}_V${vText}deg`;
        }
      } else {
        const curveAngle = parseFloat(curveSlider.value);
        curveText = curveAngle === 0 ? 'Flat' : `${curveAngle > 0 ? 'Concave' : 'Convex'}_${Math.abs(curveAngle)}deg`;
      }

      const filename = `${productName}_Top_View_${dimensions}_${curveText}.png`;
      captureCanvas('topViewCanvas', filename);
    }

    // Event listeners
    curveSlider.addEventListener('input', updateViews);

    // Add event listeners for GP2 dual curve controls
    if (isGP2Product) {
      horizontalCurveSlider.addEventListener('input', updateViews);
      verticalCurveSlider.addEventListener('input', updateViews);
    }

    document.getElementById('resetButton').addEventListener('click', resetView);
    document.getElementById('zoomInButton').addEventListener('click', zoomIn);
    document.getElementById('zoomOutButton').addEventListener('click', zoomOut);
    document.getElementById('captureFrontButton').addEventListener('click', captureFrontView);
    document.getElementById('captureTopButton').addEventListener('click', captureTopView);

    // Initial draw
    updateViews();
    updateZoomDisplay();
  </script>
</body>
</html>
